name: 毎日スクリーニング & メール通知

on:
  schedule:
    # 平日 10:00 UTC = 19:00 JST（市場終了後、決算開示が揃うタイミング）
    - cron: '0 10 * * 1-5'
  push:
    branches:
      - claude/stock-screening-backtest-RTDEv
    paths:
      - '.github/workflows/daily_notify.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'スクリーニング基準日 (YYYY-MM-DD、省略時は今日)'
        required: false
      lookback_days:
        description: '遡及日数 (デフォルト: 1、月曜は3推奨)'
        required: false
        default: '1'

jobs:
  daily-screen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 毎日スクリーニング & メール通知
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          mkdir -p debug results
          DATE="${{ inputs.target_date }}"
          DAYS="${{ inputs.lookback_days || '1' }}"
          python main.py notify \
            ${DATE:+--date "$DATE"} \
            --lookback-days "$DAYS" 2>&1 | tee debug/daily_notify_last_run.txt

      - name: ログをリポジトリに保存
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'debug/daily_notify_last_run.txt';
            let content = '';
            try { content = fs.readFileSync(path, 'utf8'); } catch(e) { content = 'ログファイルなし'; }
            const encoded = Buffer.from(content).toString('base64');
            let sha;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path, ref: 'claude/stock-screening-backtest-RTDEv'
              });
              sha = res.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: 'debug: 毎日スクリーニングログ自動更新',
              content: encoded, sha,
              branch: 'claude/stock-screening-backtest-RTDEv'
            });

      - name: スクリーニング結果をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screen-${{ github.run_id }}
          path: results/daily_screen_*.csv
          retention-days: 7
