name: 毎日スクリーニング & メール通知

on:
  schedule:
    # 朝 0:15 UTC = 9:15 JST（前日終値で保有状況投稿）
    - cron: '15 0 * * 1-5'
    # 夕方 9:00 UTC = 18:00 JST（本日の開示銘柄一覧投稿）
    - cron: '0 9 * * 1-5'
    # 夜 10:00 UTC = 19:00 JST（スクリーニング & 保有状況投稿）
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'スクリーニング基準日 (YYYY-MM-DD、省略時は今日)'
        required: false
      lookback_days:
        description: '遡及日数 (デフォルト: 1、月曜は3推奨)'
        required: false
        default: '1'

jobs:
  # ── 朝ジョブ: 保有状況のみ ──────────────────────────────
  morning-portfolio:
    if: github.event_name == 'schedule' && startsWith(github.event.schedule, '15 0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 保有ポジション損益をThreadsに投稿（朝）
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python main.py portfolio_post

  # ── 夕方ジョブ: 開示銘柄一覧投稿 ──────────────────────
  disclosure-post:
    if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 9')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 本日の開示銘柄一覧をThreadsに投稿
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          mkdir -p debug
          DATE="${{ inputs.target_date }}"
          python main.py disclosure_post ${DATE:+--date "$DATE"} 2>&1 | tee debug/disclosure_last_run.txt

      - name: ログをリポジトリに保存
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'debug/disclosure_last_run.txt';
            let content = '';
            try { content = fs.readFileSync(path, 'utf8'); } catch(e) { content = 'ログファイルなし'; }
            const encoded = Buffer.from(content).toString('base64');
            let sha;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path, ref: 'claude/stock-screening-backtest-RTDEv'
              });
              sha = res.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: 'debug: 開示投稿ログ自動更新',
              content: encoded, sha,
              branch: 'claude/stock-screening-backtest-RTDEv'
            });

  # ── 夜ジョブ: スクリーニング + 保有状況 ─────────────────
  daily-screen:
    if: github.event_name != 'schedule' || startsWith(github.event.schedule, '0 10')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 保有ポジション損益をThreadsに投稿（夜）
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          mkdir -p debug
          DATE="${{ inputs.target_date }}"
          python main.py portfolio_post ${DATE:+--date "$DATE"} 2>&1 | tee debug/daily_notify_last_run.txt

      - name: 毎日スクリーニング & メール通知 & Threads投稿
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          mkdir -p results
          DATE="${{ inputs.target_date }}"
          DAYS="${{ inputs.lookback_days || '1' }}"
          if [ -z "$DATE" ] && [ "${{ github.event_name }}" = "push" ]; then
            DATE=$(date -u +%Y-%m-%d)
            DOW=$(date -u +%u)
            DAYS=$([ "$DOW" = "1" ] && echo "3" || echo "1")
          fi
          python main.py notify \
            ${DATE:+--date "$DATE"} \
            --lookback-days "$DAYS" 2>&1 | tee -a debug/daily_notify_last_run.txt

      - name: スクリーニング結果をリポジトリに保存
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let files = [];
            try {
              files = fs.readdirSync('results')
                .filter(f => /^daily_(screen|disclosed)_\d{4}-\d{2}-\d{2}\.csv$/.test(f))
                .map(f => `results/${f}`);
            } catch(e) { core.info('resultsディレクトリなし'); return; }
            for (const filePath of files) {
              let content = '';
              try { content = fs.readFileSync(filePath, 'utf8'); } catch(e) { continue; }
              const encoded = Buffer.from(content).toString('base64');
              let sha;
              try {
                const res = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo,
                  path: filePath, ref: 'claude/stock-screening-backtest-RTDEv'
                });
                sha = res.data.sha;
              } catch(e) {}
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner, repo: context.repo.repo,
                path: filePath, message: `results: スクリーニング結果 ${filePath}`,
                content: encoded, sha,
                branch: 'claude/stock-screening-backtest-RTDEv'
              });
              core.info(`committed: ${filePath}`);
            }

      - name: ログをリポジトリに保存
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'debug/daily_notify_last_run.txt';
            let content = '';
            try { content = fs.readFileSync(path, 'utf8'); } catch(e) { content = 'ログファイルなし'; }
            const encoded = Buffer.from(content).toString('base64');
            let sha;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path, ref: 'claude/stock-screening-backtest-RTDEv'
              });
              sha = res.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: 'debug: 毎日スクリーニングログ自動更新',
              content: encoded, sha,
              branch: 'claude/stock-screening-backtest-RTDEv'
            });

      - name: スクリーニング結果をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screen-${{ github.run_id }}
          path: results/daily_screen_*.csv
          retention-days: 7
