name: バックテスト実行

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD)'
        required: false
        default: '2022-01-01'
      end_date:
        description: '終了日 (YYYY-MM-DD)'
        required: false
        default: '2024-12-31'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: トークン確認
        env:
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: |
          echo "トークン長: ${#JQUANTS_REFRESH_TOKEN} 文字"
          python - <<'EOF'
          import os, re
          token = os.environ.get("JQUANTS_REFRESH_TOKEN", "")
          print(f"長さ: {len(token)}")
          print(f"改行含む: {'はい' if chr(10) in token or chr(13) in token else 'いいえ'}")
          print(f"スペース含む: {'はい' if ' ' in token else 'いいえ'}")
          clean = token.strip()
          print(f"strip後の長さ: {len(clean)}")
          EOF

      - name: バックテスト実行
        env:
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: |
          python main.py backtest --start ${{ inputs.start_date }} --end ${{ inputs.end_date }}

      - name: 結果をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          retention-days: 30
