name: バックテスト実行

on:
  push:
    branches:
      - claude/stock-screening-backtest-RTDEv
    paths-ignore:
      - '.github/workflows/daily_notify.yml'
      - 'debug/daily_notify_last_run.txt'
  workflow_dispatch:
    inputs:
      api_key:
        description: 'J-Quants API Key'
        required: false
      start_date:
        required: false
        default: '2025-01-01'
      end_date:
        required: false
        default: '2025-12-31'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: API接続テスト
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: python tests/test_api_connection.py

      - name: バックテスト実行
        id: backtest
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          mkdir -p debug results
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          python main.py backtest --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee debug/last_run.txt

      - name: 大型株込みバックテスト (時価総額上限なし)
        id: backtest_nocap
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          echo "===== BACKTEST (上限なし: 大型株含む) =====" >> debug/last_run.txt
          python main.py backtest --market-cap-max 0 --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee -a debug/last_run.txt

      - name: パラメータスイープ実行
        id: sweep
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          echo "===== PARAMETER SWEEP =====" >> debug/last_run.txt
          python main.py sweep --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee -a debug/last_run.txt

      - name: スクリーニング条件スイープ実行
        id: screen_sweep
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          echo "===== SCREENING SWEEP =====" >> debug/last_run.txt
          python main.py screen_sweep --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee -a debug/last_run.txt

      - name: エントリータイミング比較分析
        id: entry_delay
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          echo "===== ENTRY TIMING ANALYSIS =====" >> debug/last_run.txt
          python main.py entry_delay --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee -a debug/last_run.txt

      - name: 出来高急騰バックテスト
        id: volume_backtest
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          echo "===== VOLUME SURGE BACKTEST =====" >> debug/last_run.txt
          python main.py volume_backtest --start "${START:-2025-01-01}" --end "${END:-2025-12-31}" 2>&1 | tee -a debug/last_run.txt

      - name: ログをリポジトリに保存
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'debug/last_run.txt';
            let content = '';
            try { content = fs.readFileSync(path, 'utf8'); } catch(e) { content = 'ログファイルなし'; }
            const encoded = Buffer.from(content).toString('base64');
            let sha;
            try {
              const res = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path, ref: 'claude/stock-screening-backtest-RTDEv'
              });
              sha = res.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: 'debug: バックテストログ自動更新',
              content: encoded, sha,
              branch: 'claude/stock-screening-backtest-RTDEv'
            });

      - name: 結果をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          retention-days: 30

      - name: 失敗時に終了コードを返す
        if: steps.backtest.outcome == 'failure'
        run: exit 1
