name: バックテスト実行

on:
  push:
    branches:
      - claude/stock-screening-backtest-RTDEv
  workflow_dispatch:
    inputs:
      api_key:
        description: 'J-Quants API Key（マイページの「現在のAPI Key」をコピー）'
        required: false
      start_date:
        description: '開始日 (YYYY-MM-DD)'
        required: false
        default: '2022-01-01'
      end_date:
        description: '終了日 (YYYY-MM-DD)'
        required: false
        default: '2024-12-31'

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stock-screening-backtest-RTDEv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: バックテスト実行
        env:
          JQUANTS_API_KEY: ${{ inputs.api_key || secrets.JQUANTS_API_KEY }}
        run: |
          python main.py backtest --start ${{ inputs.start_date || '2022-01-01' }} --end ${{ inputs.end_date || '2024-12-31' }}

      - name: 結果をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
          retention-days: 30
